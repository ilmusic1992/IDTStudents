<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>שוק ההון מ־0 ל־100 · IDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C0B; --panel:#12160F; --panel2:#171C14;
    --green:#02F63F; --green-dim:#0A7D28; --line:#243021;
    --ink:#E8EFEA; --muted:#8FA394;
    --danger:#ff5a5a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Assistant",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overflow-x:hidden;
  }
  img{-webkit-user-drag:none; user-drag:none}
  .mono{font-family:"Montserrat",sans-serif}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .card{
    width:min(400px,100%); background:linear-gradient(180deg,var(--panel),#0d110c);
    border:1px solid var(--line); border-radius:18px; padding:34px 28px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .brand{display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:6px}
  .brand img{height:46px}
  .card h1{font-size:20px; margin:14px 0 2px; text-align:center; font-weight:700}
  .card p.sub{margin:0 0 22px; text-align:center; color:var(--muted); font-size:14px}
  label{display:block; font-size:13px; color:var(--muted); margin:0 2px 6px}
  input{
    width:100%; padding:13px 14px; margin-bottom:16px; border-radius:11px;
    background:#0c0f0b; border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:15px; outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--green-dim)}
  .btn{
    width:100%; padding:13px; border:0; border-radius:11px; cursor:pointer;
    background:var(--green); color:#04220d; font-weight:700; font-size:15px;
    font-family:inherit; transition:filter .15s, transform .05s;
  }
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6; cursor:default}
  .msg{margin-top:14px; font-size:13.5px; text-align:center; min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--green)}

  /* ---------- READER ---------- */
  #reader[hidden]{display:none}
  .topbar{
    position:sticky; top:0; z-index:200; display:flex; align-items:center; gap:14px;
    padding:10px 16px; background:rgba(10,12,11,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar img.logo{height:30px}
  .topbar .title{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topbar .spacer{flex:1}
  .whoami{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; white-space:nowrap}
  .whoami .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .logout{background:transparent; border:1px solid var(--line); color:var(--ink); padding:7px 12px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:13px}
  .logout:hover{border-color:var(--green-dim)}

  .content-wrap{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:30px 22px 80px}
  .doc{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:34px 30px; line-height:1.75}
  .doc h1{font-size:26px; border-bottom:2px solid var(--green); padding-bottom:8px; margin:34px 0 14px}
  .doc h1:first-child{margin-top:0}
  .doc h2{font-size:19px; color:var(--green); margin:26px 0 10px}
  .doc p{margin:0 0 12px}
  .doc ul{margin:0 0 14px; padding-inline-start:22px} .doc li{margin:4px 0}
  .doc .demo-flag{display:inline-block; font-size:12px; color:#04220d; background:var(--green); padding:3px 10px; border-radius:20px; margin-bottom:18px; font-weight:700}
  .empty{color:var(--muted); text-align:center; padding:40px}

  /* ---------- WATERMARK OVERLAY (the identity layer) ---------- */
  .wm{position:fixed; inset:0; z-index:100; pointer-events:none}
  #wmLogo{opacity:.05; background-repeat:repeat; background-size:200px auto}
  #wmMail{background-repeat:repeat}

  /* ---------- print & selection guards (deterrents) ---------- */
  @media print{
    body *{display:none!important}
    body::after{content:"אין הרשאת הדפסה למסמך זה"; display:block; padding:40px; font-size:20px}
  }
  ::selection{background:transparent}
</style>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="login">
    <div class="card">
      <div class="brand"><img id="loginLogo" alt="IDT"></div>
      <h1>שוק ההון מ־0 ל־100</h1>
      <p class="sub">כניסה לתלמידי האקדמיה בלבד</p>
      <label for="email">אימייל</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com">
      <label for="pass">סיסמה</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="loginBtn">כניסה</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- ================= READER ================= -->
  <div id="reader" hidden>
    <div class="topbar">
      <img class="logo" id="barLogo" alt="IDT">
      <span class="title">שוק ההון מ־0 ל־100</span>
      <span class="spacer"></span>
      <span class="whoami"><span class="dot"></span><span id="whoEmail"></span></span>
      <button class="logout" id="logoutBtn">יציאה</button>
    </div>
    <div class="content-wrap">
      <div class="doc" id="content"><div class="empty">טוען תוכן…</div></div>
    </div>
    <!-- identity watermark layers -->
    <div class="wm" id="wmLogo"></div>
    <div class="wm" id="wmMail"></div>
  </div>

  const LOGO_SRC = "data:image/png;base64," + LOGO_B64;

  /* ===================== לוגיקה — אין צורך לגעת ===================== */
  document.getElementById('loginLogo').src = LOGO_SRC;
  document.getElementById('barLogo').src   = LOGO_SRC;

  // האם Firebase כבר הוגדר? כל עוד לא — נכנסים ל"מצב תצוגה מקדימה" כדי לבדוק את המראה.
  const CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== "PASTE_API_KEY";

  let db=null, auth=null;
  if(CONFIGURED){
    try{
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db   = firebase.firestore();
    }catch(e){ console.error(e); }
  }

  const $ = id => document.getElementById(id);
  const loginView = $('login'), readerView = $('reader');
  const msg = (t,cls)=>{ const m=$('loginMsg'); m.textContent=t; m.className='msg '+(cls||''); };
  if(!CONFIGURED){ msg("מצב תצוגה מקדימה — הזן אימייל כלשהו ולחץ כניסה כדי לראות את הצופה.",""); }

  function readRole(data){
    if(!data) return null;
    for(const f of ROLE_FIELDS){ if(data[f]) return String(data[f]); }
    return null;
  }

  async function gateAndEnter(user){
    try{
      const snap = await db.collection(USERS_COLLECTION).doc(user.uid).get();
      const role = readRole(snap.exists ? snap.data() : null);
      const ok = role && ALLOWED_ROLES.map(r=>r.toLowerCase()).includes(role.toLowerCase());
      if(!ok){
        await auth.signOut();
        msg("החשבון אינו מאושר לצפייה. פנה למנהל האקדמיה.","err");
        return;
      }
      startReader(user.email || "student");
    }catch(e){
      console.error(e);
      msg("שגיאה באימות ההרשאה. נסה שוב.","err");
    }
  }

  function buildWatermark(email){
    // רקע לוגו מרוצף, עמום
    $('wmLogo').style.backgroundImage = `url("${LOGO_SRC}")`;
    // אריח SVG עם האימייל באלכסון — נבנה דינמית לכל משתמש
    const safe = String(email).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const svg =
      `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='210'>`+
      `<text x='30' y='120' transform='rotate(-28 180 105)' `+
      `font-family='Montserrat, Arial, sans-serif' font-size='15' `+
      `fill='rgba(255,255,255,0.10)'>${safe}</text></svg>`;
    const uri = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
    $('wmMail').style.backgroundImage = `url("${uri}")`;
  }

  function renderDoc(sections){
    const c = $('content');
    if(!sections.length){
      c.innerHTML = `<div class="doc-demo"><span class="demo-flag">תצוגה לדוגמה</span>`+
        `<h1>פרק א' — מה זה שוק ההון</h1>`+
        `<p>זהו תוכן לדוגמה כדי שתראה איך נראה הצופה וסימן המים. `+
        `ברגע שתעלה את מסמכי החוברת ל־Firestore (אוסף <b>booklet</b>), הם יופיעו כאן במקום הטקסט הזה.</p>`+
        `<h2>שוק ההון הוא "זירה"</h2>`+
        `<p>שבה נפגשים קונים ומוכרים כדי לסחור בנכסים פיננסיים כמו מניות, אג"ח, מדדים וחוזים עתידיים.</p></div>`;
      return;
    }
    c.innerHTML = sections.map(s =>
      (s.title ? `<h1>${s.title}</h1>` : "") + (s.html || "")
    ).join("");
  }

  async function loadBooklet(){
    try{
      const q = await db.collection(BOOKLET_COLLECTION).orderBy("order").get();
      const items = q.docs.map(d=>d.data());
      renderDoc(items);
    }catch(e){
      console.error(e);
      renderDoc([]); // fallback לתצוגה לדוגמה
    }
  }

  function startReader(email){
    loginView.hidden = true;
    readerView.hidden = false;
    $('whoEmail').textContent = email;
    buildWatermark(email);
    loadBooklet();
  }

  // כניסה
  $('loginBtn').addEventListener('click', async ()=>{
    // מצב תצוגה מקדימה — לפני חיבור Firebase
    if(!CONFIGURED){
      const demoMail=$('email').value.trim() || "demo@idt-academy.co.il";
      startReader(demoMail); return;
    }
    const email=$('email').value.trim(), pass=$('pass').value;
    if(!email || !pass){ msg("נא למלא אימייל וסיסמה.","err"); return; }
    $('loginBtn').disabled=true; msg("מתחבר…","");
    try{
      const cred = await auth.signInWithEmailAndPassword(email, pass);
      await gateAndEnter(cred.user);
    }catch(e){
      msg("אימייל או סיסמה שגויים.","err");
    }finally{ $('loginBtn').disabled=false; }
  });
  $('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });

  // יציאה
  $('logoutBtn').addEventListener('click', async ()=>{
    if(auth) await auth.signOut();
    readerView.hidden=true; loginView.hidden=false;
    $('pass').value=''; msg("");
  });

  // שמירת מצב חיבור
  if(auth){
    auth.onAuthStateChanged(u=>{ if(u && readerView.hidden) gateAndEnter(u); });
  }

  /* ===== הרתעות view-only (לא חסינות — נועדו למזדמנים) ===== */
  ['contextmenu','selectstart','copy','cut','dragstart'].forEach(ev=>
    document.addEventListener(ev, e=>e.preventDefault()));
  document.addEventListener('keydown', e=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey) && ['s','p','u','c'].includes(k)) e.preventDefault();
    if(k==='f12') e.preventDefault();
    if((e.ctrlKey||e.metaKey) && e.shiftKey && ['i','j','c'].includes(k)) e.preventDefault();
  });
  </script>
